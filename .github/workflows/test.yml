name: Tests and Docker integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/classic.js
  docker:
    runs-on: ubuntu-latest
    env:
      APP_PASSWORD: ci-ephemeral-app-password
      SECRET_KEY: ci-ephemeral-session-secret-1234567890
      DB_PASSWORD: ci-ephemeral-db-password
      DB_ROOT_PASSWORD: ci-ephemeral-root-password
      APP_BIND: 127.0.0.1
      APP_PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f portainer-stack.yml config --quiet
      - run: docker compose -f portainer-stack.yml up --build -d
      - run: docker compose -f portainer-stack.yml exec -T app wks2csv -v
      - run: python scripts/docker_smoke.py
      - if: failure()
        run: docker compose -f portainer-stack.yml logs --no-color
      - if: always()
        run: docker compose -f portainer-stack.yml down -v
